<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Релятивистская кабина</title>
    <link rel="icon" href="data:," />
    <style>
      html, body, #root { margin: 0; height: 100%; background: #000; overflow: hidden; }
      body { font-family: ui-monospace, Menlo, Consolas, monospace; color: #8fa3b5; }
      canvas { touch-action: none; }
      .hint { position: fixed; left: 16px; bottom: 12px; font-size: 12px; opacity: .65; pointer-events: none; }
      .zoom { position: fixed; right: 16px; top: 12px; font-size: 13px; pointer-events: none; }
      .lang { position: fixed; left: 16px; top: 12px; display: flex; gap: 4px; z-index: 2; }
      .lang button { font: 600 12px system-ui, sans-serif; color: #cfd6de; background: rgba(16, 20, 26, .72); border: 1px solid #3a4452;
        border-radius: 4px; padding: 3px 9px; cursor: pointer; }
      .lang button.on { color: #fff; background: #2f6fdd; border-color: #2f6fdd; }
      .reticle { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: #d7e3ee; opacity: .8; pointer-events: none; }
      .prompt { position: fixed; left: 50%; top: calc(50% + 22px); transform: translateX(-50%); padding: 3px 9px; font-size: 13px; color: #d7e3ee; background: rgb(8 12 16 / .6); border-radius: 3px; pointer-events: none; }
      .reticle[hidden], .prompt[hidden] { display: none; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
